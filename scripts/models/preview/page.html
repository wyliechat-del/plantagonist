<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #fff; }</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Called from render.mjs: window.setup(glbUrl, info, size), then window.draw(opts).
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.add(new THREE.HemisphereLight(0xffffff, 0xaaaaaa, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2, 4, -3);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 5000);
const nodes = {};
const movers = [];
let radius = 1, centre = new THREE.Vector3();

window.setup = async (url, info, size) => {
  renderer.setSize(size, size);
  const gltf = await new GLTFLoader().loadAsync(url);
  scene.add(gltf.scene);
  // Plain matte shading, so colours show close to their real values (shiny
  // materials wash them out towards white).
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    nodes[o.name] = o;
    const m = o.material;
    o.material = new THREE.MeshLambertMaterial({ color: m.color, transparent: m.transparent,
      opacity: m.opacity, side: m.side, depthWrite: !m.transparent });
  });
  // Moving parts turn about a hinge: wrap each in a group placed at its hinge.
  for (const mv of info.moving || []) {
    const hinge = new THREE.Vector3(...mv.hinge);
    // "all" moves the whole model (so parts with their own movers ride along).
    for (const part of mv.parts === "all" ? [null] : mv.parts) {
      const mesh = part === null ? gltf.scene : nodes[part];
      if (!mesh) continue;
      // A part with more than one mover gets nested pivots, so the hinge
      // is turned into the parent's own coordinates.
      gltf.scene.updateMatrixWorld(true);
      const local = mesh.parent.worldToLocal(hinge.clone());
      const pivot = new THREE.Group();
      pivot.position.copy(local);
      mesh.parent.add(pivot);
      pivot.add(mesh);
      mesh.position.sub(local);
      movers.push({ pivot, mv, hinge: local, axis: new THREE.Vector3(...(mv.axis || [0, 1, 0])) });
    }
  }
  const box = new THREE.Box3().setFromObject(gltf.scene);
  box.getCenter(centre);
  radius = box.getSize(new THREE.Vector3()).length() / 2;
};

window.draw = ({ azimuth = 0, elevation = 0, time: clock = null, hide = [], zoom = 1, event = null }) => {
  for (const [name, m] of Object.entries(nodes)) m.visible = !hide.includes(name);
  for (const m of Object.values(nodes)) {
    m.userData.opacity ??= m.material.opacity;
    m.material.opacity = m.userData.opacity;
    m.material.transparent = m.userData.opacity < 1;
  }
  // time 0..1 is one animation loop; null shows the rest pose. Movers for
  // another event (onEvent) stay at rest.
  for (const { pivot, mv, hinge, axis } of movers) {
    const time = mv.onEvent && event && mv.onEvent !== event ? null : clock;
    let angle = 0, size = 1, sy = 1, hop = 0, sxz = 1;
    pivot.visible = !(time === null && (mv.hiddenAtRest || mv.previewOnly));
    if (time !== null && mv.keys) {
      // Keyframes: [time, offset [x, y, z], scale [x, y, z], turn?, opacity?], eased between keys.
      const k = mv.keys;
      let i = 0;
      while (i < k.length - 2 && time > k[i + 1][0]) i++;
      const [t0, o0, s0] = k[i], [t1, o1, s1] = k[i + 1];
      let f = Math.min(1, Math.max(0, (time - t0) / (t1 - t0)));
      f = f * f * (3 - 2 * f);
      const mix = (a, b) => a.map((v, j) => v + (b[j] - v) * f);
      const o = mix(o0, o1), sc = mix(s0, s1);
      // Optional 4th value: turn in degrees about up (Y).
      const turn = (k[i][3] || 0) + ((k[i + 1][3] || 0) - (k[i][3] || 0)) * f;
      pivot.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(turn));
      pivot.scale.set(Math.max(sc[0], 1e-4), Math.max(sc[1], 1e-4), Math.max(sc[2], 1e-4));
      pivot.position.set(hinge.x + o[0], hinge.y + o[1], hinge.z + o[2]);
      // Optional 5th value: opacity (1 solid, 0 gone).
      if (k[i].length > 4) {
        const fade = k[i][4] + (k[i + 1][4] - k[i][4]) * f;
        pivot.traverse((m) => {
          if (!m.isMesh) return;
          m.material.opacity = m.userData.opacity * fade;
          m.material.transparent = m.material.opacity < 1;
        });
      }
      continue;
    }
    if (time !== null && mv.spread) {
      // Spread: during the landing squish (same timing as a bounce), widen
      // by `wide` and shorten by `short` about the hinge, so leaves fan out.
      const s = mv.spread, c = (mv.cycles * time) % 1, air = 1 - s.squashShare;
      const f = c < air ? 0 : Math.sin(Math.PI * (c - air) / s.squashShare);
      sxz = 1 + (s.wide - 1) * f;
      sy = 1 - (1 - s.short) * f;
      angle = (s.turn || 0) * f;   // and/or turn `turn` degrees about the axis
    } else if (time !== null && mv.bounce) {
      // Bounce: a hop (a smooth arc up and down), then on landing a squish
      // to `squash` of full height and back, for the last `squashShare` of each cycle.
      const b = mv.bounce, c = (mv.cycles * time) % 1, air = 1 - b.squashShare;
      if (c < air) hop = b.height * Math.sin(Math.PI * c / air);
      else sy = 1 - (1 - b.squash) * Math.sin(Math.PI * (c - air) / b.squashShare);
    } else if (time !== null && mv.spin !== undefined) {
      // Spin: turn steadily, `spin` degrees per cycle.
      angle = mv.spin * mv.cycles * time;
    } else if (time !== null && mv.swing !== undefined) {
      // Rock: swing degrees either side of upright, shrinking by `shrink`
      // at the ends of the swing and back to full size when upright.
      const s = Math.sin(2 * Math.PI * mv.cycles * time);
      angle = mv.swing * s;
      size = 1 - (mv.shrink || 0) * Math.abs(s);
    } else if (time !== null) {
      // Flap: back and forth between `from` and `to`.
      angle = mv.from + (mv.to - mv.from) * (1 - Math.cos(2 * Math.PI * mv.cycles * time)) / 2;
    }
    pivot.quaternion.setFromAxisAngle(axis, THREE.MathUtils.degToRad(angle));
    pivot.scale.set(size * sxz, size * sy, size * sxz);
    pivot.position.set(hinge.x, hinge.y + hop, hinge.z);
  }
  // azimuth 0 looks at the front (-Z side), 90 from the +X side.
  const a = THREE.MathUtils.degToRad(azimuth), e = THREE.MathUtils.degToRad(elevation);
  // zoom > 1 pulls the camera back (e.g. to fit blobs that fly out).
  const d = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05 * zoom;
  camera.position.set(centre.x + d * Math.cos(e) * Math.sin(a), centre.y + d * Math.sin(e),
                      centre.z - d * Math.cos(e) * Math.cos(a));
  camera.lookAt(centre);
  renderer.render(scene, camera);
};
window.ready = true;
</script>
</body>
</html>
