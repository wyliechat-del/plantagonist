<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #fff; }</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Called from render.mjs: window.setup(glbUrl, info, size), then window.draw(opts).
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(2, 4, -3);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const nodes = {};
const wings = [];
let radius = 1, centre = new THREE.Vector3();

window.setup = async (url, info, size) => {
  renderer.setSize(size, size);
  const gltf = await new GLTFLoader().loadAsync(url);
  scene.add(gltf.scene);
  gltf.scene.traverse((o) => { if (o.isMesh) nodes[o.name] = o; });
  // Moving parts turn about a hinge: wrap each in a group placed at its hinge.
  for (const [name, w] of Object.entries(info.wings || {})) {
    if (!w.hinge) continue;
    const hinge = new THREE.Vector3(...w.hinge);
    for (const part of [name, w.rim]) {
      const mesh = nodes[part];
      if (!mesh) continue;
      const pivot = new THREE.Group();
      pivot.position.copy(hinge);
      mesh.parent.add(pivot);
      pivot.add(mesh);
      mesh.position.sub(hinge);
      wings.push({ pivot, axis: new THREE.Vector3(...w.axis), sign: w.sign });
    }
  }
  const box = new THREE.Box3().setFromObject(gltf.scene);
  box.getCenter(centre);
  radius = box.getSize(new THREE.Vector3()).length() / 2;
};

window.draw = ({ azimuth = 0, elevation = 0, flap = 0, hide = [] }) => {
  for (const [name, m] of Object.entries(nodes)) m.visible = !hide.includes(name);
  for (const w of wings) w.pivot.quaternion.setFromAxisAngle(w.axis, THREE.MathUtils.degToRad(flap * w.sign));
  // azimuth 0 looks at the front (-Z side), 90 from the +X side.
  const a = THREE.MathUtils.degToRad(azimuth), e = THREE.MathUtils.degToRad(elevation);
  const d = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  camera.position.set(centre.x + d * Math.cos(e) * Math.sin(a), centre.y + d * Math.sin(e),
                      centre.z - d * Math.cos(e) * Math.cos(a));
  camera.lookAt(centre);
  renderer.render(scene, camera);
};
window.ready = true;
</script>
</body>
</html>
