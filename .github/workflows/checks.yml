name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools from rokit.toml
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Rojo build
        run: |
          mkdir -p build
          rojo build default.project.json -o build/plantagonist.rbxl

      - name: Unit tests
        run: lune run tests

      - name: Lint
        run: selene src tests

      - name: Format
        run: stylua --check src tests
